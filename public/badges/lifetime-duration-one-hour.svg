<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg-lifetime-duration-one-hour" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f5e9;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#c8e6c9;stop-opacity:1"/>
    </linearGradient>
    <clipPath id="circle-clip-lifetime-duration-one-hour">
      <circle cx="100" cy="100" r="90"/>
    </clipPath>
  </defs>
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="95" fill="#2e7d32" opacity="0.3"/>
  <circle cx="100" cy="100" r="90" fill="url(#bg-lifetime-duration-one-hour)"/>
  <!-- Inner border -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#2e7d32" stroke-width="4"/>
  <!-- Illustration -->
  <g clip-path="url(#circle-clip-lifetime-duration-one-hour)">
    <rect x="60" y="100" width="80" height="30" rx="5" fill="#bdbdbd" stroke="#757575" stroke-width="2"/>
   <path d="M65 115 L135 115" stroke="#9e9e9e" stroke-width="1" stroke-dasharray="3,2"/>
   <circle cx="100" cy="72" r="22" fill="white" stroke="#2e7d32" stroke-width="3"/>
   <line x1="100" y1="72" x2="100" y2="58" stroke="#2e7d32" stroke-width="2.5" stroke-linecap="round"/>
   <line x1="100" y1="72" x2="110" y2="72" stroke="#4caf50" stroke-width="2" stroke-linecap="round"/>
   <circle cx="100" cy="72" r="2" fill="#2e7d32"/>
   <text x="100" y="148" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#1b5e20">1 HOUR</text>
  </g>
  <!-- Label banner -->
  <rect x="20" y="160" width="160" height="28" rx="14" fill="#2e7d32" opacity="0.85"/>
  <text x="100" y="179" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">FIRST HOUR</text>
</svg>