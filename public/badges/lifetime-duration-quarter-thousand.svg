      <stop offset="0%" style="stop-color:#f9fbe7;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f0f4c3;stop-opacity:1"/>
    </linearGradient>
    <clipPath id="circle-clip-lifetime-duration-quarter-thousand">
      <circle cx="100" cy="100" r="90"/>
    </clipPath>
  </defs>
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="95" fill="#827717" opacity="0.3"/>
  <circle cx="100" cy="100" r="90" fill="url(#bg-lifetime-duration-quarter-thousand)"/>
  <!-- Inner border -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#827717" stroke-width="4"/>
  <!-- Illustration -->
