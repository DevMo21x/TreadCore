<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg-lifetime-elevation-cn-tower" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fce4ec;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f8bbd0;stop-opacity:1"/>
    </linearGradient>
    <clipPath id="circle-clip-lifetime-elevation-cn-tower">
      <circle cx="100" cy="100" r="90"/>
    </clipPath>
  </defs>
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="95" fill="#c62828" opacity="0.3"/>
  <circle cx="100" cy="100" r="90" fill="url(#bg-lifetime-elevation-cn-tower)"/>
  <!-- Inner border -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#c62828" stroke-width="4"/>
  <!-- Illustration -->
  <g clip-path="url(#circle-clip-lifetime-elevation-cn-tower)">
    <rect x="97" y="35" width="6" height="110" fill="#d32f2f"/>
   <ellipse cx="100" cy="95" rx="18" ry="8" fill="#ef5350" stroke="#c62828" stroke-width="1.5"/>
   <ellipse cx="100" cy="92" rx="14" ry="5" fill="#ffcdd2"/>
   <rect x="99" y="30" width="2" height="15" fill="#b71c1c"/>
   <path d="M82 95 L75 100 M118 95 L125 100" stroke="#c62828" stroke-width="1.5"/>
   <text x="100" y="148" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#b71c1c">553m</text>
  </g>
  <!-- Label banner -->
  <rect x="20" y="160" width="160" height="28" rx="14" fill="#c62828" opacity="0.85"/>
  <text x="100" y="179" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">CN TOWER CLIMB</text>
</svg>