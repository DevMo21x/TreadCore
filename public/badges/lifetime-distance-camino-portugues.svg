      <stop offset="0%" style="stop-color:#fff8e1;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ffe082;stop-opacity:1"/>
    </linearGradient>
    <clipPath id="circle-clip-lifetime-distance-camino-portugues">
      <circle cx="100" cy="100" r="90"/>
    </clipPath>
  </defs>
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="95" fill="#ff8f00" opacity="0.3"/>
