<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg-lifetime-distance-thousand" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f3e5f5;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e1bee7;stop-opacity:1"/>
    </linearGradient>
    <clipPath id="circle-clip-lifetime-distance-thousand">
      <circle cx="100" cy="100" r="90"/>
    </clipPath>
  </defs>
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="95" fill="#6a1b9a" opacity="0.3"/>
  <circle cx="100" cy="100" r="90" fill="url(#bg-lifetime-distance-thousand)"/>
  <!-- Inner border -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#6a1b9a" stroke-width="4"/>
  <!-- Illustration -->
  <g clip-path="url(#circle-clip-lifetime-distance-thousand)">
    <path d="M70 130 L75 75 Q100 65 125 75 L130 130 Z" fill="#9e9e9e" stroke="#616161" stroke-width="2"/>
   <path d="M75 80 Q100 72 125 80" fill="none" stroke="#757575" stroke-width="1"/>
   <text x="100" y="105" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#4a148c">1000</text>
   <text x="100" y="120" text-anchor="middle" font-family="Arial" font-size="9" fill="#6a1b9a">km</text>
   <path d="M65 130 L135 130" stroke="#795548" stroke-width="3"/>
   <path d="M60 133 Q100 138 140 133" fill="#8d6e63" stroke="none"/>
  </g>
  <!-- Label banner -->
  <rect x="20" y="160" width="160" height="28" rx="14" fill="#6a1b9a" opacity="0.85"/>
  <text x="100" y="179" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">1000km TREKKER</text>
</svg>