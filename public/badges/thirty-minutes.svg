<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg-thirty-minutes" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fff3e0;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ffa726;stop-opacity:1"/>
    </linearGradient>
    <clipPath id="circle-clip-thirty-minutes">
      <circle cx="100" cy="100" r="90"/>
    </clipPath>
  </defs>
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="95" fill="#e65100" opacity="0.3"/>
  <circle cx="100" cy="100" r="90" fill="url(#bg-thirty-minutes)"/>
  <!-- Inner border -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#e65100" stroke-width="4"/>
  <!-- Illustration -->
  <g clip-path="url(#circle-clip-thirty-minutes)">
    <path d="M72 55 L128 55 L108 88 L128 125 L72 125 L92 88 Z" fill="#fff8e1" stroke="#e65100" stroke-width="3"/>
   <path d="M76 58 L124 58 L108 85 Z" fill="#ffb74d" opacity="0.7"/>
