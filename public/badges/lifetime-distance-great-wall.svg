      <stop offset="0%" style="stop-color:#ffebee;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ffcdd2;stop-opacity:1"/>
    </linearGradient>
    <clipPath id="circle-clip-lifetime-distance-great-wall">
      <circle cx="100" cy="100" r="90"/>
    </clipPath>
  </defs>
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="95" fill="#b71c1c" opacity="0.3"/>
  <circle cx="100" cy="100" r="90" fill="url(#bg-lifetime-distance-great-wall)"/>
  <!-- Inner border -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#b71c1c" stroke-width="4"/>
  <!-- Illustration -->
