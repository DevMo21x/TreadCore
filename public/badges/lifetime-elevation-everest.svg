      <stop offset="0%" style="stop-color:#1a237e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#283593;stop-opacity:1"/>
    </linearGradient>
    <clipPath id="circle-clip-lifetime-elevation-everest">
      <circle cx="100" cy="100" r="90"/>
    </clipPath>
  </defs>
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="95" fill="#ffd54f" opacity="0.3"/>
  <circle cx="100" cy="100" r="90" fill="url(#bg-lifetime-elevation-everest)"/>
  <!-- Inner border -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#ffd54f" stroke-width="4"/>
  <!-- Illustration -->
