  <!-- Label banner -->
  <rect x="20" y="160" width="160" height="28" rx="14" fill="#ffd54f" opacity="0.85"/>
  <text x="100" y="179" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">EVEREST SUMMITEER</text>
