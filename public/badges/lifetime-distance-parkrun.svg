<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg-lifetime-distance-parkrun" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f5e9;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#a5d6a7;stop-opacity:1"/>
    </linearGradient>
    <clipPath id="circle-clip-lifetime-distance-parkrun">
      <circle cx="100" cy="100" r="90"/>
    </clipPath>
  </defs>
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="95" fill="#388e3c" opacity="0.3"/>
  <circle cx="100" cy="100" r="90" fill="url(#bg-lifetime-distance-parkrun)"/>
  <!-- Inner border -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#388e3c" stroke-width="4"/>
  <!-- Illustration -->
  <g clip-path="url(#circle-clip-lifetime-distance-parkrun)">
    <path d="M30 140 Q60 120 80 130 Q100 140 120 125 Q140 110 170 120" fill="none" stroke="#4caf50" stroke-width="4" stroke-linecap="round"/>
   <circle cx="50" cy="105" r="12" fill="#66bb6a"/>
   <rect x="48" y="115" width="4" height="15" fill="#795548"/>
   <circle cx="90" cy="95" r="15" fill="#43a047"/>
   <rect x="88" y="108" width="4" height="18" fill="#795548"/>
   <circle cx="140" cy="100" r="10" fill="#66bb6a"/>
   <rect x="138" y="108" width="4" height="12" fill="#795548"/>
   <path d="M60 70 L65 55 L70 70" fill="#81c784" stroke="none"/>
   <text x="100" y="80" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="#2e7d32">5km</text>
  </g>
  <!-- Label banner -->
  <rect x="20" y="160" width="160" height="28" rx="14" fill="#388e3c" opacity="0.85"/>
  <text x="100" y="179" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">PARKRUN PIONEER</text>
</svg>