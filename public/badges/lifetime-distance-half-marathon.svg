<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg-lifetime-distance-half-marathon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fff3e0;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ffcc80;stop-opacity:1"/>
    </linearGradient>
    <clipPath id="circle-clip-lifetime-distance-half-marathon">
      <circle cx="100" cy="100" r="90"/>
    </clipPath>
  </defs>
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="95" fill="#e65100" opacity="0.3"/>
  <circle cx="100" cy="100" r="90" fill="url(#bg-lifetime-distance-half-marathon)"/>
  <!-- Inner border -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#e65100" stroke-width="4"/>
  <!-- Illustration -->
  <g clip-path="url(#circle-clip-lifetime-distance-half-marathon)">
    <path d="M40 150 L60 90 L100 70 L140 90 L160 150" fill="none" stroke="#bf360c" stroke-width="3"/>
   <rect x="80" y="60" width="40" height="5" fill="#ff5722" rx="2"/>
   <text x="100" y="55" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#bf360c">FINISH</text>
   <text x="100" y="100" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#e65100">21.1</text>
   <text x="100" y="118" text-anchor="middle" font-family="Arial" font-size="11" fill="#bf360c">kilometres</text>
   <circle cx="60" cy="90" r="4" fill="#ff8a65"/>
   <circle cx="140" cy="90" r="4" fill="#ff8a65"/>
  </g>
  <!-- Label banner -->
  <rect x="20" y="160" width="160" height="28" rx="14" fill="#e65100" opacity="0.85"/>
  <text x="100" y="179" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">HALF MARATHON HERO</text>
</svg>