<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg-lifetime-distance-century" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e3f2fd;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#90caf9;stop-opacity:1"/>
    </linearGradient>
    <clipPath id="circle-clip-lifetime-distance-century">
      <circle cx="100" cy="100" r="90"/>
    </clipPath>
  </defs>
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="95" fill="#1565c0" opacity="0.3"/>
  <circle cx="100" cy="100" r="90" fill="url(#bg-lifetime-distance-century)"/>
  <!-- Inner border -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#1565c0" stroke-width="4"/>
  <!-- Illustration -->
  <g clip-path="url(#circle-clip-lifetime-distance-century)">
    <text x="100" y="105" text-anchor="middle" font-family="Arial" font-size="40" font-weight="bold" fill="#1565c0">100</text>
   <text x="100" y="125" text-anchor="middle" font-family="Arial" font-size="10" fill="#1976d2">kilometres</text>
   <ellipse cx="55" cy="135" rx="5" ry="8" fill="#42a5f5" transform="rotate(-15 55 135)"/>
   <ellipse cx="70" cy="130" rx="5" ry="8" fill="#42a5f5" transform="rotate(-10 70 130)"/>
   <ellipse cx="130" cy="130" rx="5" ry="8" fill="#42a5f5" transform="rotate(10 130 130)"/>
   <ellipse cx="145" cy="135" rx="5" ry="8" fill="#42a5f5" transform="rotate(15 145 135)"/>
  </g>
  <!-- Label banner -->
  <rect x="20" y="160" width="160" height="28" rx="14" fill="#1565c0" opacity="0.85"/>
  <text x="100" y="179" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">CENTURY STRIDER</text>
</svg>