<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg-lifetime-duration-thousand-hours" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a148c;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#6a1b9a;stop-opacity:1"/>
    </linearGradient>
    <clipPath id="circle-clip-lifetime-duration-thousand-hours">
      <circle cx="100" cy="100" r="90"/>
    </clipPath>
  </defs>
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="95" fill="#ffd54f" opacity="0.3"/>
  <circle cx="100" cy="100" r="90" fill="url(#bg-lifetime-duration-thousand-hours)"/>
  <!-- Inner border -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#ffd54f" stroke-width="4"/>
  <!-- Illustration -->
  <g clip-path="url(#circle-clip-lifetime-duration-thousand-hours)">
    <circle cx="100" cy="100" r="30" fill="white" stroke="#ffd54f" stroke-width="3"/>
   <text x="100" y="107" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#4a148c">1000</text>
   <text x="100" y="119" text-anchor="middle" font-family="Arial" font-size="7" fill="#6a1b9a">HOURS</text>
   <path d="M75 62 L80 50 L90 58 L100 45 L110 58 L120 50 L125 62 Z" fill="#ffd54f" stroke="#ffb300" stroke-width="1.5"/>
   <circle cx="80" cy="48" r="3" fill="#ff6f00"/>
   <circle cx="100" cy="43" r="3" fill="#ff6f00"/>
   <circle cx="120" cy="48" r="3" fill="#ff6f00"/>
  </g>
  <!-- Label banner -->
  <rect x="20" y="160" width="160" height="28" rx="14" fill="#ffd54f" opacity="0.85"/>
  <text x="100" y="179" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">1000 HOUR TRIUMPH</text>
</svg>