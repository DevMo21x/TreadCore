   <polygon points="131,76 136,86 146,86 139,93 141,104 131,98 121,104 123,93 116,86 126,86" fill="#fdd835" stroke="#f9a825" stroke-width="1"/>
   <polygon points="162,76 167,86 177,86 170,93 172,104 162,98 152,104 154,93 147,86 157,86" fill="#fdd835" stroke="#f9a825" stroke-width="1"/>
