<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg-lifetime-elevation-above-the-clouds" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4fc3f7;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0288d1;stop-opacity:1"/>
    </linearGradient>
    <clipPath id="circle-clip-lifetime-elevation-above-the-clouds">
      <circle cx="100" cy="100" r="90"/>
    </clipPath>
  </defs>
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="95" fill="#01579b" opacity="0.3"/>
  <circle cx="100" cy="100" r="90" fill="url(#bg-lifetime-elevation-above-the-clouds)"/>
  <!-- Inner border -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#01579b" stroke-width="4"/>
  <!-- Illustration -->
  <g clip-path="url(#circle-clip-lifetime-elevation-above-the-clouds)">
    <path d="M80 70 L100 40 L120 70 Z" fill="#37474f"/>
   <path d="M80 70 L100 40 L100 70 Z" fill="#546e7a"/>
   <path d="M95 45 L100 40 L105 45" fill="white"/>
   <path d="M20 90 Q40 80 60 90 Q80 100 100 90 Q120 80 140 90 Q160 100 180 90 L180 100 Q160 110 140 100 Q120 90 100 100 Q80 110 60 100 Q40 90 20 100 Z" fill="white" opacity="0.9"/>
   <path d="M30 100 Q50 92 70 100 Q90 108 110 100 Q130 92 150 100 Q170 108 180 105" fill="white" opacity="0.6"/>
   <text x="100" y="130" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="white">15,000m</text>
  </g>
  <!-- Label banner -->
  <rect x="20" y="160" width="160" height="28" rx="14" fill="#01579b" opacity="0.85"/>
  <text x="100" y="179" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">ABOVE THE CLOUDS</text>
</svg>