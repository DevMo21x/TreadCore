<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg-lifetime-distance-royal-parks" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f3e5f5;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ce93d8;stop-opacity:1"/>
    </linearGradient>
    <clipPath id="circle-clip-lifetime-distance-royal-parks">
      <circle cx="100" cy="100" r="90"/>
    </clipPath>
  </defs>
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="95" fill="#7b1fa2" opacity="0.3"/>
  <circle cx="100" cy="100" r="90" fill="url(#bg-lifetime-distance-royal-parks)"/>
  <!-- Inner border -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#7b1fa2" stroke-width="4"/>
  <!-- Illustration -->
  <g clip-path="url(#circle-clip-lifetime-distance-royal-parks)">
    <rect x="75" y="55" width="50" height="70" fill="none" stroke="#4a148c" stroke-width="3" rx="2"/>
   <path d="M75 55 Q100 40 125 55" fill="none" stroke="#4a148c" stroke-width="3"/>
   <rect x="85" y="70" width="12" height="40" fill="#e1bee7" stroke="#7b1fa2" stroke-width="1"/>
   <rect x="103" y="70" width="12" height="40" fill="#e1bee7" stroke="#7b1fa2" stroke-width="1"/>
   <circle cx="50" cy="80" r="15" fill="#66bb6a"/>
   <rect x="48" y="93" width="4" height="18" fill="#795548"/>
   <circle cx="150" cy="80" r="15" fill="#66bb6a"/>
   <rect x="148" y="93" width="4" height="18" fill="#795548"/>
   <path d="M70 140 Q100 130 130 140" fill="none" stroke="#8d6e63" stroke-width="3" stroke-dasharray="6,4"/>
   <text x="100" y="148" text-anchor="middle" font-family="Arial" font-size="11" fill="#4a148c">10km</text>
  </g>
  <!-- Label banner -->
  <rect x="20" y="160" width="160" height="28" rx="14" fill="#7b1fa2" opacity="0.85"/>
  <text x="100" y="179" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">ROYAL PARKS RAMBLER</text>
