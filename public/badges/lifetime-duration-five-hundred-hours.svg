<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg-lifetime-duration-five-hundred-hours" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#263238;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#37474f;stop-opacity:1"/>
    </linearGradient>
    <clipPath id="circle-clip-lifetime-duration-five-hundred-hours">
      <circle cx="100" cy="100" r="90"/>
    </clipPath>
  </defs>
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="95" fill="#00bcd4" opacity="0.3"/>
  <circle cx="100" cy="100" r="90" fill="url(#bg-lifetime-duration-five-hundred-hours)"/>
  <!-- Inner border -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#00bcd4" stroke-width="4"/>
  <!-- Illustration -->
  <g clip-path="url(#circle-clip-lifetime-duration-five-hundred-hours)">
    <circle cx="100" cy="90" r="40" fill="none" stroke="#00bcd4" stroke-width="2" stroke-dasharray="3,3"/>
   <circle cx="100" cy="55" r="3" fill="#80deea"/>
   <circle cx="130" cy="70" r="2.5" fill="#80deea"/>
   <circle cx="135" cy="95" r="2" fill="#80deea"/>
   <circle cx="120" cy="120" r="3" fill="#80deea"/>
   <circle cx="80" cy="120" r="2" fill="#80deea"/>
   <circle cx="65" cy="95" r="2.5" fill="#80deea"/>
   <circle cx="70" cy="70" r="2" fill="#80deea"/>
   <path d="M100 55 L130 70 L135 95 L120 120 L80 120 L65 95 L70 70 Z" fill="none" stroke="#4dd0e1" stroke-width="1" opacity="0.5"/>
   <text x="100" y="97" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#e0f7fa">500</text>
   <text x="100" y="140" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#4dd0e1">HOURS</text>
  </g>
  <!-- Label banner -->
  <rect x="20" y="160" width="160" height="28" rx="14" fill="#00bcd4" opacity="0.85"/>
  <text x="100" y="179" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">500 HOUR HERO</text>
</svg>