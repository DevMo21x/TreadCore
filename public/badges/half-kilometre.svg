<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg-half-kilometre" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f5e9;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#a5d6a7;stop-opacity:1"/>
    </linearGradient>
    <clipPath id="circle-clip-half-kilometre">
      <circle cx="100" cy="100" r="90"/>
    </clipPath>
  </defs>
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="95" fill="#2e7d32" opacity="0.3"/>
  <circle cx="100" cy="100" r="90" fill="url(#bg-half-kilometre)"/>
  <!-- Inner border -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#2e7d32" stroke-width="4"/>
  <!-- Illustration -->
  <g clip-path="url(#circle-clip-half-kilometre)">
    <path d="M75 130 L78 70 Q100 58 122 70 L125 130 Z" fill="#9e9e9e" stroke="#616161" stroke-width="2"/>
   <path d="M78 75 Q100 65 122 75" fill="none" stroke="#757575" stroke-width="1"/>
   <text x="100" y="100" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#1b5e20">0.5</text>
   <text x="100" y="116" text-anchor="middle" font-family="Arial" font-size="10" fill="#2e7d32">km</text>
   <path d="M68 130 L132 130" stroke="#795548" stroke-width="3"/>
   <path d="M62 133 Q100 138 138 133" fill="#8d6e63" stroke="none"/>
   <path d="M30 115 Q40 100 55 108 Q70 116 80 110" fill="none" stroke="#66bb6a" stroke-width="2"/>
  </g>
  <!-- Label banner -->
  <rect x="20" y="160" width="160" height="28" rx="14" fill="#2e7d32" opacity="0.85"/>
  <text x="100" y="179" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">HALF KILOMETRE</text>
</svg>