<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg-five-kilometres" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f5e9;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#c8e6c9;stop-opacity:1"/>
    </linearGradient>
    <clipPath id="circle-clip-five-kilometres">
      <circle cx="100" cy="100" r="90"/>
    </clipPath>
  </defs>
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="95" fill="#388e3c" opacity="0.3"/>
  <circle cx="100" cy="100" r="90" fill="url(#bg-five-kilometres)"/>
  <!-- Inner border -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#388e3c" stroke-width="4"/>
  <!-- Illustration -->
  <g clip-path="url(#circle-clip-five-kilometres)">
    <path d="M30 130 Q60 118 100 122 Q140 126 175 115" fill="none" stroke="#a5d6a7" stroke-width="3" stroke-dasharray="6,4"/>
   <rect x="60" y="85" width="4" height="40" fill="#5d4037"/>
   <rect x="136" y="85" width="4" height="40" fill="#5d4037"/>
   <rect x="62" y="90" width="76" height="8" fill="#e53935" rx="2" opacity="0.85"/>
   <rect x="62" y="102" width="76" height="8" fill="white" rx="1" opacity="0.85"/>
   <text x="100" y="98" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold" fill="white">FINISH</text>
   <text x="100" y="70" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#2e7d32">5km</text>
  </g>
  <!-- Label banner -->
  <rect x="20" y="160" width="160" height="28" rx="14" fill="#388e3c" opacity="0.85"/>
  <text x="100" y="179" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">FIVE KILOMETRES</text>
</svg>