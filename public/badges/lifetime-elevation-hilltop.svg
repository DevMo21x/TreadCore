<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg-lifetime-elevation-hilltop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f5e9;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#c8e6c9;stop-opacity:1"/>
    </linearGradient>
    <clipPath id="circle-clip-lifetime-elevation-hilltop">
      <circle cx="100" cy="100" r="90"/>
    </clipPath>
  </defs>
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="95" fill="#388e3c" opacity="0.3"/>
  <circle cx="100" cy="100" r="90" fill="url(#bg-lifetime-elevation-hilltop)"/>
  <!-- Inner border -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#388e3c" stroke-width="4"/>
  <!-- Illustration -->
  <g clip-path="url(#circle-clip-lifetime-elevation-hilltop)">
    <path d="M20 140 Q60 140 80 115 Q95 95 100 90 Q105 95 120 115 Q140 140 180 140 Z" fill="#66bb6a"/>
