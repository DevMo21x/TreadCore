<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg-first-100-metres" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f1f8e9;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#aed581;stop-opacity:1"/>
    </linearGradient>
    <clipPath id="circle-clip-first-100-metres">
      <circle cx="100" cy="100" r="90"/>
    </clipPath>
  </defs>
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="95" fill="#558b2f" opacity="0.3"/>
  <circle cx="100" cy="100" r="90" fill="url(#bg-first-100-metres)"/>
  <!-- Inner border -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#558b2f" stroke-width="4"/>
  <!-- Illustration -->
  <g clip-path="url(#circle-clip-first-100-metres)">
    <ellipse cx="95" cy="80" rx="14" ry="22" fill="#8d6e63" transform="rotate(-10 95 80)"/>
   <ellipse cx="88" cy="62" rx="5" ry="7" fill="#795548" transform="rotate(-10 88 62)"/>
   <ellipse cx="97" cy="58" rx="5" ry="7" fill="#795548" transform="rotate(-5 97 58)"/>
   <ellipse cx="106" cy="60" rx="5" ry="7" fill="#795548" transform="rotate(5 106 60)"/>
   <ellipse cx="112" cy="66" rx="4" ry="6" fill="#795548" transform="rotate(15 112 66)"/>
   <text x="100" y="120" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#33691e">100m</text>
   <text x="100" y="138" text-anchor="middle" font-family="Arial" font-size="10" fill="#558b2f">FIRST STEP</text>
  </g>
  <!-- Label banner -->
  <rect x="20" y="160" width="160" height="28" rx="14" fill="#558b2f" opacity="0.85"/>
  <text x="100" y="179" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">FIRST 100 METRES</text>
</svg>