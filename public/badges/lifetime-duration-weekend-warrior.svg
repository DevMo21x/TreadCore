<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg-lifetime-duration-weekend-warrior" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ede7f6;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#d1c4e9;stop-opacity:1"/>
    </linearGradient>
    <clipPath id="circle-clip-lifetime-duration-weekend-warrior">
      <circle cx="100" cy="100" r="90"/>
    </clipPath>
  </defs>
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="95" fill="#4527a0" opacity="0.3"/>
  <circle cx="100" cy="100" r="90" fill="url(#bg-lifetime-duration-weekend-warrior)"/>
  <!-- Inner border -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#4527a0" stroke-width="4"/>
  <!-- Illustration -->
  <g clip-path="url(#circle-clip-lifetime-duration-weekend-warrior)">
    <rect x="55" y="60" width="40" height="45" rx="3" fill="white" stroke="#5e35b1" stroke-width="2"/>
   <rect x="55" y="60" width="40" height="12" rx="3" fill="#7c4dff"/>
   <text x="75" y="90" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#311b92">SAT</text>
   <rect x="105" y="70" width="40" height="45" rx="3" fill="white" stroke="#5e35b1" stroke-width="2"/>
   <rect x="105" y="70" width="40" height="12" rx="3" fill="#7c4dff"/>
   <text x="125" y="100" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#311b92">SUN</text>
   <text x="100" y="140" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#4527a0">48 HOURS</text>
  </g>
  <!-- Label banner -->
  <rect x="20" y="160" width="160" height="28" rx="14" fill="#4527a0" opacity="0.85"/>
  <text x="100" y="179" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">WEEKEND WARRIOR</text>
</svg>